name: Prepare Nordic Woods JPEG
on:
  push:
    branches:
      - feature/smthng-motion-nordic-2026-11-04
    paths:
      - 'assets/img/nordic-woods-9676.HEIC'
      - '.github/workflows/prepare-nordic-photo.yml'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install HEIF converter
        run: sudo apt-get update -qq && sudo apt-get install -y libheif-examples libheif-plugin-libde265
      - name: Convert original to browser-compatible JPEG
        run: heif-convert -q 86 assets/img/nordic-woods-9676.HEIC assets/img/nordic-woods-v3.jpg
      - name: Commit converted JPEG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img/nordic-woods-v3.jpg
          git commit -m 'assets: convert Nordic Woods original to JPEG'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep 4
          done
          exit 1
